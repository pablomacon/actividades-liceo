<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingreso docente | Profemacón Algoritmos</title>
    <link rel="stylesheet" href="docente.css" />
  </head>
  <body>
    <main class="page">
      <section class="card login-card" aria-labelledby="tituloLogin">
        <div class="brand">
          <h1 id="tituloLogin" class="brand-title">Panel docente</h1>
          <p class="brand-subtitle">
            Ingresá con tu correo y contraseña para consultar evidencias de aprendizaje.
          </p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>

          <button class="btn btn-primary" type="submit">Ingresar</button>
        </form>

        <p id="mensajeLogin" class="mensaje" aria-live="polite"></p>

        <div class="actions">
          <button class="btn btn-secondary" type="button" disabled>
            Olvidé mi contraseña
          </button>
        </div>

        <p class="note">
          La recuperación por correo queda prevista para una segunda etapa. Por ahora, el reinicio de contraseña se realiza de forma manual desde administración.
        </p>
      </section>
    </main>

    <script src="docente-auth.js"></script>
    <script>
      iniciarLoginDocente();
    </script>
  </body>
</html>
